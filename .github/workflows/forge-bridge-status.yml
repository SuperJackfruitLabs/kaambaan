# Written by the estate github bridge (provision/272-github-bridge.sh). Runs on GitHub only.
name: forge bridge status
on:
  push:
    branches: ['forge-bridge/status']
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency: forge-bridge-status
jobs:
  relay:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { events } = JSON.parse(fs.readFileSync('status.json', 'utf8'));
            for (const e of events) {
              const marker = `<!-- forge-bridge:${e.id} -->`;
              const comments = await github.paginate(github.rest.issues.listComments,
                { ...context.repo, issue_number: e.pr, per_page: 100 });
              if (comments.some(c => (c.body || '').includes(marker))) continue;
              await github.rest.issues.createComment({ ...context.repo, issue_number: e.pr,
                body: `**forge:** ${e.message}\n\n${marker}` });
              if (e.close) await github.rest.pulls.update({ ...context.repo, pull_number: e.pr, state: 'closed' });
              core.info(`posted ${e.id}`);
            }
