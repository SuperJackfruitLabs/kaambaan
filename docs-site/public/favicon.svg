<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="kaambaan">
  <!-- A board: three lanes, and one card that has moved to the last one.
       Work crossing a gate is the product; the icon says that at 16px. -->
  <rect width="32" height="32" rx="7" fill="#1f6f5c"/>
  <g fill="#ffffff">
    <rect x="6"  y="8"  width="5" height="9"  rx="1.5" opacity=".45"/>
    <rect x="13.5" y="8" width="5" height="13" rx="1.5" opacity=".7"/>
    <rect x="21" y="8"  width="5" height="6"  rx="1.5"/>
  </g>
  <circle cx="23.5" cy="19.5" r="2.5" fill="#7ee3c1"/>
</svg>
